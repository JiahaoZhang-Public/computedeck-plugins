[project]
name = "computedeck-hello"
version = "0.1.0"
description = "Hello: a ComputeDeck plugin"
requires-python = ">=3.12"
dependencies = ["computedeck>=0.3.0a0,<0.7"]

[project.entry-points."computedeck.plugins"]
hello = "computedeck_hello:plugin"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computedeck_hello"]
artifacts = ["src/computedeck_hello/web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

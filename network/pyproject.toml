[project]
name = "computedeck-network"
version = "0.3.0a0"
description = "Proxy diagnostics and egress tests for Mihomo or Clash setups"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "computedeck>=0.3.0a0,<0.8",
    "pyyaml>=6,<7",
]

[project.entry-points."computedeck.plugins"]
proxy = "computedeck_network.plugins:proxy"
egress = "computedeck_network.plugins:egress"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computedeck_network"]
# The run-time UI bundle (scripts/build-plugin-web.sh) is ignored by git but shipped.
artifacts = ["src/computedeck_network/web"]

[tool.hatch.build.targets.sdist]
exclude = ["node_modules"]
artifacts = ["src/computedeck_network/web"]

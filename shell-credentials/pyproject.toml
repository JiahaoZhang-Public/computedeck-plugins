[project]
name = "computedeck-shell-credentials"
version = "0.3.0a0"
description = "shell:NAME credentials read from a private file or ~/.zshrc"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "computedeck>=0.3.0a0,<0.5",
]

[project.entry-points."computedeck.plugins"]
shell-credentials = "computedeck_shell_credentials.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computedeck_shell_credentials"]

[tool.hatch.build.targets.sdist]
exclude = ["node_modules"]
